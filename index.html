<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burger Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        :root {
            --bg-wall: #e8f4f8;
            --counter-top: #ffccb6;
            --primary-font: 'Fredoka One', cursive;
        }

        * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }

        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
            font-family: var(--primary-font); touch-action: none; display: flex; flex-direction: column;
        }

        /* --- UI & HUD --- */
        #hud {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 15px 20px; font-size: 28px; z-index: 100; position: absolute;
            top: 0; left: 0; right: 0; pointer-events: none;
        }
        #money { color: #2ea65a; text-shadow: 2px 2px 0 #fff; pointer-events: auto; }
        
        #menu-buttons { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; align-items: flex-end; }
        #action-buttons { display: flex; flex-direction: column; gap: 10px; }

        .btn {
            background: #ffd3b6; border: 4px solid #ffaa77; border-radius: 12px;
            padding: 8px 15px; font-family: inherit; font-size: 18px; color: #333;
            cursor: pointer; box-shadow: 0 4px 0 #ffaa77; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* --- 3D Environment --- */
        #game-area { flex: 1; position: relative; perspective: 800px; display: flex; flex-direction: column; }
        #customer-zone {
            flex: 1; position: relative; display: flex; justify-content: center; align-items: center;
            background: repeating-linear-gradient(90deg, #fff, #fff 40px, var(--bg-wall) 40px, var(--bg-wall) 80px);
        }
        #counter { height: 45vh; position: relative; transform-style: preserve-3d; }
        #counter-top {
            position: absolute; width: 150vw; height: 100%; left: -25vw;
            background: var(--counter-top); transform: rotateX(40deg); transform-origin: top;
            box-shadow: inset 0 20px 50px rgba(0,0,0,0.1);
        }

        /* --- Customer Blob (Scaled down 1.5x) --- */
        .blob {
            position: absolute; 
            width: 120px; height: 106px; /* 1.5x smaller */
            background: #ff8b94;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            box-shadow: inset -10px -10px 0 rgba(0,0,0,0.1), 0 15px 15px rgba(0,0,0,0.2);
            animation: morph 3s linear infinite, float 2s ease-in-out infinite;
            display: flex; justify-content: center; align-items: center; gap: 13px; /* Smaller gap for eyes */
            bottom: 40px; left: -200px; transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s;
            z-index: 5;
        }
        .blob.at-counter { left: calc(50% - 60px); /* Adjusted for new width */ }
        .blob.leaving { left: 110vw; }
        .blob.angry { background-color: #e74c3c !important; animation: shake 0.1s linear infinite !important; }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shake {
            0%, 50%, 100% { transform: translate(0,0); }
            25% { transform: translate(-3px, 2px); }
            75% { transform: translate(3px, -2px); }
        }
        .eye { width: 13px; height: 16px; background: #333; border-radius: 50%; animation: blink 4s infinite; }
        @keyframes blink { 0%, 96%, 98%, 100% { transform: scaleY(1); } 97%, 99% { transform: scaleY(0.1); } }

        /* --- The Combo Order Bubble (EXPLODED VIEW & Scaled down) --- */
        #order-bubble {
            position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%) scale(0);
            background: white; padding: 10px 15px; border-radius: 15px; border: 3px solid #333;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; gap: 10px;
            opacity: 0; transition: all 0.3s ease; z-index: 10;
        }
        #order-bubble.show { opacity: 1; transform: translateX(-50%) scale(0.7); /* Bubble scales down globally */ }
        #order-bubble::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -8px;
            border-width: 8px; border-style: solid; border-color: #333 transparent transparent transparent;
        }
        .order-col { display: flex; flex-direction: column-reverse; align-items: center; justify-content: center; gap: 4px; }

        /* --- BULLETPROOF CSS GRAPHICS --- */
        .ing-bun-bottom { background: #e09641; height: 25px; border-radius: 5px 5px 15px 15px; width: 100px; box-shadow: inset 0 -5px 0 #bc7a32; position: relative;}
        .ing-bun-top { background: #e09641; height: 35px; border-radius: 40px 40px 5px 5px; width: 100px; box-shadow: inset 0 -5px 0 #bc7a32; position: relative;}
        .ing-patty { background: #5c3a21; height: 22px; border-radius: 12px; width: 105px; box-shadow: inset 0 -5px 0 #3a2211; position: relative;}
        .ing-cheese { background: #f1c40f; height: 10px; border-radius: 2px; width: 108px; position: relative;}
        .ing-lettuce { background: #2ecc71; height: 14px; border-radius: 8px; width: 110px; border-bottom: 4px dashed #27ae60; position: relative;}
        
        .ing-fries {
            background: #e74c3c; height: 40px; width: 35px; border-radius: 4px 4px 10px 10px;
            position: relative; border: 2px solid #c0392b; border-top: 2px solid #fff;
        }
        .ing-fries::before {
            content: ''; position: absolute; top: -18px; left: 2px; right: 2px; height: 18px;
            background: repeating-linear-gradient(90deg, #f1c40f 0px, #f1c40f 6px, transparent 6px, transparent 10px);
            border-radius: 2px;
        }

        .ing-drink {
            background: #3498db; height: 45px; width: 32px; border-radius: 4px 4px 10px 10px;
            position: relative; border: 2px solid #2980b9; border-top: 6px solid #fff;
        }
        .ing-drink::before {
            content: ''; position: absolute; width: 6px; height: 24px; background: #ff4d4d;
            top: -22px; left: 12px; transform: rotate(15deg); border-radius: 3px; border: 1px solid #c0392b;
        }

        /* --- COMBO TRAY (Moved Up 1.2x) --- */
        #tray {
            position: absolute; 
            bottom: 66%; /* MOVED UP FROM 55% */
            left: 50%; transform: translateX(-50%);
            width: 280px; height: 45px; background: rgba(255,255,255,0.7);
            border: 5px solid rgba(255,255,255,0.9); border-radius: 20px;
            box-shadow: 0 15px 20px rgba(0,0,0,0.15); display: flex; justify-content: space-around;
            align-items: flex-end; padding: 0 10px; cursor: grab; touch-action: none;
        }
        .slot { position: relative; width: 80px; height: 10px; }
        .stacked-item { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; }

        /* --- Bins (Moved up 1.4x visually) --- */
        #bins {
            position: absolute; 
            bottom: 6vh; /* MOVED UP from the absolute bottom */
            left: 0; width: 100%; display: flex;
            justify-content: center; gap: 10px; padding: 10px; z-index: 20; flex-wrap: wrap;
        }
        .bin {
            width: 65px; height: 65px; background: white; border-radius: 15px;
            box-shadow: 0 6px 0 #cbd5e1; display: flex; justify-content: center; align-items: center;
            cursor: grab; touch-action: none; border: 3px solid #e2e8f0;
        }
        .bin > div { transform: scale(0.6); pointer-events: none; }
        .hidden-item { display: none !important; }

        /* --- Drag Ghost --- */
        #drag-ghost {
            position: fixed; pointer-events: none; z-index: 3000;
            transform: translate(-50%, -50%); filter: drop-shadow(0 25px 15px rgba(0,0,0,0.4));
            display: none;
        }
        .ghost-tray {
            width: 280px; height: 45px; background: rgba(255,255,255,0.7);
            border: 5px solid rgba(255,255,255,0.9); border-radius: 20px;
            display: flex; justify-content: space-around; align-items: flex-end; padding: 0 10px;
        }

        /* --- Modals --- */
        .modal-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 4000;
        }
        .modal-box { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 85%; max-width: 400px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; padding: 12px; background: #f8fafc; border-radius: 15px; border: 2px solid #e2e8f0; }

        /* --- Effects --- */
        .money-pop { position: absolute; font-size: 42px; text-shadow: 2px 2px 0 #fff; animation: floatUp 1s forwards; pointer-events: none; z-index: 500; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.4); } }

        /* --- Tutorial Clean Hand --- */
        #tutorial-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1500; pointer-events: none; display: none; }
        #tutorial-text { position: absolute; top: 15%; width: 100%; text-align: center; font-size: 28px; color: #334155; text-shadow: 2px 2px 0 #fff; }
        #tutorial-hand { position: absolute; width: 60px; height: 60px; pointer-events: none; z-index: 1600; transition: none; }
    </style>
</head>
<body>

    <div id="hud">
        <div id="money">$0</div>
        <div id="menu-buttons">
            <div id="action-buttons">
                <button class="btn" onclick="openModal('shop-modal')">SHOP</button>
                <button class="btn" style="background:#a8e6cf; border-color:#5ca682; box-shadow:0 4px 0 #5ca682;" onclick="openModal('updates-modal')">UPDATES</button>
            </div>
            <button class="btn" id="btn-toggle" style="background:#b4a7d6; border-color:#8b7ba8; box-shadow:0 4px 0 #8b7ba8;" onclick="toggleUI()">HIDE UI</button>
        </div>
    </div>

    <div id="game-area">
        <div id="customer-zone"></div>

        <div id="counter">
            <div id="counter-top">
                <div id="tray">
                    <div class="slot" id="slot-burger"></div>
                    <div class="slot" id="slot-side"></div>
                    <div class="slot" id="slot-drink"></div>
                </div>
            </div>
        </div>

        <div id="bins">
            <div class="bin" data-type="bun-bottom" id="bin-bun-bottom"><div class="ing-bun-bottom"></div></div>
            <div class="bin" data-type="patty" id="bin-patty"><div class="ing-patty"></div></div>
            <div class="bin" data-type="cheese" id="bin-cheese"><div class="ing-cheese"></div></div>
            <div class="bin" data-type="lettuce" id="bin-lettuce"><div class="ing-lettuce"></div></div>
            <div class="bin" data-type="bun-top" id="bin-bun-top"><div class="ing-bun-top"></div></div>
            <div class="bin hidden-item" id="bin-fries" data-type="fries"><div class="ing-fries"></div></div>
            <div class="bin hidden-item" id="bin-drink" data-type="drink"><div class="ing-drink"></div></div>
        </div>
    </div>

    <div id="drag-ghost"></div>

    <div id="shop-modal" class="modal-bg">
        <div class="modal-box">
            <h2>UPGRADES</h2>
            <div class="shop-item" id="shop-fries">
                <span>FRIES ($50)</span>
                <button class="btn" onclick="buyItem('fries', 50)">BUY</button>
            </div>
            <div class="shop-item" id="shop-drink">
                <span>DRINK ($100)</span>
                <button class="btn" onclick="buyItem('drink', 100)">BUY</button>
            </div>
            <button class="btn" style="margin-top:20px; background:#ff8b94; border-color:#ff5a66; box-shadow: 0 4px 0 #ff5a66;" onclick="closeModal('shop-modal')">CLOSE</button>
        </div>
    </div>

    <div id="updates-modal" class="modal-bg">
        <div class="modal-box">
            <h2 style="color:#2ea65a;">Updates</h2>
            <div style="text-align: left; font-family: sans-serif; margin-bottom: 20px; line-height: 1.5;">
                <b>v1.0 May 23 2026:</b> base game.<br>
                <b>v1.1 May 23 2026:</b> The tray is pushed back closer to the customers, and ingredient bins are moved up slightly. Also a hide ui button was added. <br>
               
            </div>
            <button class="btn" style="background:#a8e6cf; border-color:#5ca682; box-shadow: 0 4px 0 #5ca682;" onclick="closeModal('updates-modal')">AWESOME</button>
        </div>
    </div>

    <div id="tutorial-overlay">
        <div id="tutorial-text">Build a burger!</div>
        <div id="tutorial-hand">
            <svg viewBox="0 0 24 24" fill="#f1c40f" stroke="#333" stroke-width="1.5">
                <path d="M8 13V4C8 2.9 8.9 2 10 2C11.1 2 12 2.9 12 4V10H13V7C13 5.9 13.9 5 15 5C16.1 5 17 5.9 17 7V10H18V9C18 7.9 18.9 7 20 7C21.1 7 22 7.9 22 9V15C22 18.3 19.3 21 16 21H11C7.7 21 5 18.3 5 15V11C5 9.9 5.9 9 7 9C8.1 9 9 9.9 9 11V13H8Z" />
            </svg>
        </div>
    </div>

    <script>
        // --- Core Data ---
        let money = parseInt(localStorage.getItem('blobBurger_money')) || 0;
        let unlocks = JSON.parse(localStorage.getItem('blobBurger_unlocks')) || { fries: false, drink: false };
        
        let trayHistory = []; 
        let currentOrder = { burger: [], side: null, drink: null };
        let activeCustomer = null;
        let customerQueueActive = false;
        let uiHidden = false;
        
        const blobColors = ['#ff8b94', '#ffaaa5', '#ffd3b6', '#a8e6cf', '#b4a7d6', '#9b59b6', '#3498db'];

        // Drag Variables
        let isDragging = false;
        let dragSource = ''; 
        let draggedType = '';
        let dragStartX = 0;
        let dragStartY = 0;

        // Tutorial
        let isTutorial = localStorage.getItem('blobBurger_tutorialDone') ? false : true;
        let tutorialStep = 0; 
        let loopInterval = null;

        // UI Elements
        const trayEl = document.getElementById('tray');
        const ghostEl = document.getElementById('drag-ghost');
        const moneyEl = document.getElementById('money');
        const customerZone = document.getElementById('customer-zone');

        const slotBurger = document.getElementById('slot-burger');
        const slotSide = document.getElementById('slot-side');
        const slotDrink = document.getElementById('slot-drink');

        // Init UI
        moneyEl.innerText = `$${money}`;
        if (unlocks.fries) { document.getElementById('shop-fries').style.display = 'none'; document.getElementById('bin-fries').classList.remove('hidden-item'); }
        if (unlocks.drink) { document.getElementById('shop-drink').style.display = 'none'; document.getElementById('bin-drink').classList.remove('hidden-item'); }

        function saveData() { localStorage.setItem('blobBurger_money', money); localStorage.setItem('blobBurger_unlocks', JSON.stringify(unlocks)); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- Toggle UI System ---
        function toggleUI() {
            uiHidden = !uiHidden;
            const actionBtns = document.getElementById('action-buttons');
            const toggleBtn = document.getElementById('btn-toggle');
            if (uiHidden) {
                actionBtns.style.display = 'none';
                toggleBtn.innerText = 'SHOW UI';
            } else {
                actionBtns.style.display = 'flex';
                toggleBtn.innerText = 'HIDE UI';
            }
        }

        // --- Drag & Drop System ---
        document.querySelectorAll('.bin').forEach(bin => {
            bin.addEventListener('pointerdown', (e) => {
                if (isTutorial && bin.getAttribute('data-type') !== getExpectedTutorialType()) return;
                isDragging = true; dragSource = 'bin'; draggedType = bin.getAttribute('data-type');
                
                ghostEl.innerHTML = `<div class="ing-${draggedType}"></div>`;
                ghostEl.className = ''; ghostEl.style.display = 'block';
                updateGhostPos(e.clientX, e.clientY);
            });
        });

        trayEl.addEventListener('pointerdown', (e) => {
            if (trayHistory.length === 0) return; 
            if (isTutorial && tutorialStep < 3) return; 

            isDragging = true; dragSource = 'tray';
            dragStartX = e.clientX; dragStartY = e.clientY;
            
            ghostEl.innerHTML = trayEl.innerHTML;
            ghostEl.className = 'ghost-tray';
            ghostEl.style.display = 'flex';
            
            trayEl.style.opacity = '0.2'; 
            updateGhostPos(e.clientX, e.clientY);
        });

        document.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            updateGhostPos(e.clientX, e.clientY);
        });

        document.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            ghostEl.style.display = 'none';
            trayEl.style.opacity = '1'; 

            const mx = e.clientX; const my = e.clientY;

            if (dragSource === 'bin') {
                // Modified drop zone to accommodate the higher tray and bins
                if (my < window.innerHeight - 150) {
                    addToTray(draggedType);
                    if (isTutorial) advanceTutorial();
                }
            } else if (dragSource === 'tray') {
                // If it was just a quick tap/click, remove the last item
                if (Math.abs(mx - dragStartX) < 10 && Math.abs(my - dragStartY) < 10) {
                    trayHistory.pop();
                    renderTray();
                } 
                // Hand to customer
                else if (activeCustomer && my < window.innerHeight - 400) {
                    evaluateOrder();
                }
            }
        });

        function updateGhostPos(x, y) { ghostEl.style.left = x + 'px'; ghostEl.style.top = y + 'px'; }

        // --- Combo Tray Logic ---
        function addToTray(type) {
            if (type === 'fries' && trayHistory.includes('fries')) return;
            if (type === 'drink' && trayHistory.includes('drink')) return;
            
            trayHistory.push(type);
            renderTray();
        }

        function renderTray() {
            slotBurger.innerHTML = ''; slotSide.innerHTML = ''; slotDrink.innerHTML = '';
            let burgerHeight = 0;

            trayHistory.forEach((type, index) => {
                let item = document.createElement('div');
                item.className = `stacked-item ing-${type}`;
                item.style.zIndex = index;

                if (type === 'fries') {
                    item.style.bottom = '0px';
                    slotSide.appendChild(item);
                } else if (type === 'drink') {
                    item.style.bottom = '0px';
                    slotDrink.appendChild(item);
                } else {
                    item.style.bottom = `${burgerHeight}px`;
                    slotBurger.appendChild(item);
                    if (type === 'bun-bottom' || type === 'patty') burgerHeight += 16;
                    else if (type === 'cheese') burgerHeight += 6;
                    else if (type === 'lettuce') burgerHeight += 10;
                    else if (type === 'bun-top') burgerHeight += 25;
                }
            });
        }

        // --- Customer System ---
        function triggerCustomerFlow() {
            if (customerQueueActive) return;
            customerQueueActive = true;

            const blob = document.createElement('div');
            blob.className = 'blob'; blob.style.backgroundColor = blobColors[Math.floor(Math.random() * blobColors.length)];
            blob.innerHTML = `<div class="eye"></div><div class="eye"></div>`;
            customerZone.appendChild(blob);

            if (isTutorial) {
                currentOrder = { burger: ['bun-bottom', 'patty', 'bun-top'], side: null, drink: null };
            } else {
                let b = ['bun-bottom'];
                const pool = ['patty', 'cheese', 'lettuce'];
                let count = Math.floor(Math.random() * 3) + 1;
                for(let i=0; i<count; i++) b.push(pool[Math.floor(Math.random() * pool.length)]);
                b.push('bun-top');
                
                currentOrder = {
                    burger: b,
                    side: (unlocks.fries && Math.random() > 0.4) ? 'fries' : null,
                    drink: (unlocks.drink && Math.random() > 0.4) ? 'drink' : null
                };
            }

            // Build EXPLODED Order Bubble
            const bubble = document.createElement('div');
            bubble.id = 'order-bubble';
            
            // Burger Column
            let bCol = document.createElement('div'); bCol.className = 'order-col';
            currentOrder.burger.forEach(t => { 
                let m = document.createElement('div'); 
                m.className = `ing-${t}`; 
                m.style.transform = 'scale(0.6)'; 
                m.style.margin = '2px 0'; 
                bCol.appendChild(m); 
            });
            bubble.appendChild(bCol);

            // Fries
            if(currentOrder.side) {
                let sCol = document.createElement('div'); sCol.className = 'order-col';
                let m = document.createElement('div'); m.className = 'ing-fries'; 
                m.style.transform = 'scale(0.8)'; 
                sCol.appendChild(m);
                bubble.appendChild(sCol);
            }
            // Drink
            if(currentOrder.drink) {
                let dCol = document.createElement('div'); dCol.className = 'order-col';
                let m = document.createElement('div'); m.className = 'ing-drink'; 
                m.style.transform = 'scale(0.8)'; 
                dCol.appendChild(m);
                bubble.appendChild(dCol);
            }

            blob.appendChild(bubble);
            activeCustomer = { el: blob, bubble: bubble };

            setTimeout(() => {
                blob.classList.add('at-counter');
                setTimeout(() => {
                    bubble.classList.add('show');
                    if (isTutorial && tutorialStep === 0) startTutorialAnims();
                }, 800);
            }, 100);
        }

        function evaluateOrder() {
            let builtBurger = trayHistory.filter(t => t !== 'fries' && t !== 'drink');
            let builtSide = trayHistory.includes('fries') ? 'fries' : null;
            let builtDrink = trayHistory.includes('drink') ? 'drink' : null;

            const isPerfect = JSON.stringify(builtBurger) === JSON.stringify(currentOrder.burger) &&
                              builtSide === currentOrder.side &&
                              builtDrink === currentOrder.drink;

            const blobEl = activeCustomer.el;
            activeCustomer.bubble.classList.remove('show');

            if (isPerfect) {
                let pay = 15 + (builtBurger.length * 5) + (builtSide ? 10 : 0) + (builtDrink ? 15 : 0);
                updateMoney(pay, true);
                blobEl.style.transform = 'scale(1.2) translateY(-30px)';
            } else {
                blobEl.classList.add('angry');
                updateMoney(2, false); 
            }

            setTimeout(() => {
                blobEl.classList.remove('at-counter');
                blobEl.classList.add('leaving');
                
                trayHistory = []; renderTray();
                activeCustomer = null; customerQueueActive = false;

                setTimeout(() => { blobEl.remove(); triggerCustomerFlow(); }, 800);
            }, 600);

            if (isTutorial) {
                isTutorial = false; localStorage.setItem('blobBurger_tutorialDone', 'true');
                document.getElementById('tutorial-overlay').style.display = 'none';
                clearInterval(loopInterval);
            }
        }

        function updateMoney(amount, happy) {
            money += amount; moneyEl.innerText = `$${money}`; saveData();
            const pop = document.createElement('div'); pop.className = 'money-pop';
            pop.innerText = `+$${amount}`; pop.style.color = happy ? '#2ea65a' : '#e74c3c';
            pop.style.left = '50%'; pop.style.top = '35%';
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }

        function buyItem(item, cost) {
            if (money >= cost) {
                money -= cost; moneyEl.innerText = `$${money}`; unlocks[item] = true; saveData();
                document.getElementById(`shop-${item}`).style.display = 'none';
                document.getElementById(`bin-${item}`).classList.remove('hidden-item');
                closeModal('shop-modal');
            }
        }

        // --- Tutorial Loop ---
        function getExpectedTutorialType() {
            if (tutorialStep === 0) return 'bun-bottom';
            if (tutorialStep === 1) return 'patty';
            if (tutorialStep === 2) return 'bun-top';
            return '';
        }

        function startTutorialAnims() { document.getElementById('tutorial-overlay').style.display = 'block'; runTutorialLoop(); }
        function runTutorialLoop() {
            if (loopInterval) clearInterval(loopInterval);
            const hand = document.getElementById('tutorial-hand');
            const tRect = trayEl.getBoundingClientRect();
            
            const animateHand = () => {
                let sRect;
                if (tutorialStep === 0) sRect = document.getElementById('bin-bun-bottom').getBoundingClientRect();
                else if (tutorialStep === 1) sRect = document.getElementById('bin-patty').getBoundingClientRect();
                else if (tutorialStep === 2) sRect = document.getElementById('bin-bun-top').getBoundingClientRect();
                else if (tutorialStep === 3) sRect = trayEl.getBoundingClientRect();

                let endX = tRect.left + 50; let endY = tRect.top + 10;
                if (tutorialStep === 3) { endX = window.innerWidth / 2; endY = window.innerHeight / 2 - 50; }

                hand.style.left = (sRect.left + 15) + 'px'; hand.style.top = (sRect.top + 15) + 'px';
                hand.animate([{ left: (sRect.left+15)+'px', top: (sRect.top+15)+'px' }, { left: endX+'px', top: endY+'px' }], { duration: 1500, iterations: 1 });
            };
            animateHand(); loopInterval = setInterval(animateHand, 1800);
        }

        function advanceTutorial() {
            tutorialStep++; const txt = document.getElementById('tutorial-text');
            if (tutorialStep === 1) txt.innerText = "Add a patty!";
            if (tutorialStep === 2) txt.innerText = "Top it off!";
            if (tutorialStep === 3) txt.innerText = "Drag the TRAY to the blob!";
            runTutorialLoop();
        }

        setTimeout(triggerCustomerFlow, 600);
    </script>
</body>
